batch_size: 32
checkpoint: null
device: cpu
exp_name: est_coord
learning_rate: 0.0005
learning_rate_min: 1.0e-08
log_interval: 100
max_iter: 10000
model_hyperparams:
  activation: ReLU
  decoder_hidden_dims:
  - 512
  - 256
  encoder_hidden_dims:
  - 128
  - 1024
  light_encoder_hidden_dim: 64
  RANSAC:
    inlier_thresh: 0.010
    max_iter: 5000
    n_samples: 10

model_type: est_coord
num_workers: 12
obj_name: power_drill
point_num: 1024
robot: galbot
save_interval: 2500
seed: 0
val_interval: 500
val_num: 10
